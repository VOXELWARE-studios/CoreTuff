name: Suggestions & Feature Requests
description: Suggest features, improvements, or ideas for CoreTuff
title: "[Suggestion]: "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        # CoreTuff Suggestions

        Thanks for helping improve CoreTuff!

        You can use this page for:
        - Feature requests
        - Improvements
        - Optimization ideas
        - Addon ideas
        - UI/UX suggestions
        - API suggestions
        - General feedback

        Please provide as much detail as possible so the idea can be properly evaluated.

  - type: dropdown
    id: edition
    attributes:
      label: CoreTuff Edition
      description: Which edition is this suggestion intended for?
      options:
        - CoreTuff Community Edition (CE)
        - CoreTuff Premium
        - Both CE & Premium
        - Other / Unsure
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Suggestion Type
      description: What kind of suggestion is this?
      options:
        - New Feature
        - Improvement
        - Optimization
        - Addon Idea
        - UI/UX Suggestion
        - API Suggestion
        - Configuration
        - Integration
        - Other
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of CoreTuff does this suggestion relate to?
      options:
        - Core
        - Addon
        - Dashboard
        - Web Editor
        - API
        - Integration
        - Configuration
        - Database
        - Other
    validations:
      required: true

  - type: input
    id: addon
    attributes:
      label: Addon Name
      description: Fill this only if the suggestion is related to a specific addon.
      placeholder: ExampleAddon

  - type: textarea
    id: description
    attributes:
      label: Describe Your Suggestion
      description: Explain your idea clearly and in detail.
      placeholder: |
        Example:
        Add a modular chat formatting system with PlaceholderAPI support.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Why Is This Needed?
      description: What problem would this solve, or what would it improve?
      placeholder: |
        Explain why this feature or improvement would be useful.

  - type: textarea
    id: solution
    attributes:
      label: Suggested Solution
      description: How should this work?
      placeholder: |
        Describe how you imagine this feature functioning.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Are there existing ways to accomplish this, or alternative approaches you considered?
      placeholder: |
        Describe any existing solutions or alternatives.

  - type: textarea
    id: examples
    attributes:
      label: Examples / References
      description: Add reference plugins, screenshots, mockups, documentation, or other examples if applicable.
      placeholder: |
        Add links, screenshots, mockups, or examples here.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add anything else related to this suggestion here.
      placeholder: |
        Anything else we should know?
